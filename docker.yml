version: "3.8"

services:
    # MySQL Database Service
    db:
        image: mysql:8.0
        container_name: mysql_db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: 
            MYSQL_DATABASE: 
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql

    # phpMyAdmin Web Interface Service
    phpmyadmin:
        image: phpmyadmin/phpmyadmin:latest
        container_name: phpmyadmin_web
        restart: always
        depends_on:
            - db
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            UPLOAD_LIMIT: 300M
        ports:
            - "8080:80"

volumes:
    db_data:
